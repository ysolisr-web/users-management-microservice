spring.application.name=users-management-microservice

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# Evita ejecutar schema.sql/data.sql de MySQL en H2
spring.sql.init.mode=never

# Variables de Base de datos (Compatibilidad)
db.host=localhost
db.port=3306
db.name=users_db
db.username=sa
db.password=
db.ssl-mode=DISABLED

# Configuración de JWT
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000
jwt.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.jwtExpirationMs=86400000
jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-time=86400000

